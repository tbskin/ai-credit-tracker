<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stash</title>
    <meta name="theme-color" content="#8cbae8" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Stash home"
          ><img src="/brand/wallet.svg" alt="" width="64" height="64" /><span
            >stash</span
          ></a
        >
      </header>
      <main>
        <div class="page-title">
          <h1>Accounts</h1>
          <button id="add-account" class="primary">
            <span aria-hidden="true">+</span> Add account
          </button>
        </div>
        <section class="overview" aria-label="Account summary">
          <div class="stat-widget">
            <span class="stat-icon" aria-hidden="true">↗</span
            ><span class="caption">Connected</span
            ><strong id="connected">0</strong>
          </div>
          <div
            class="stat-widget attention-widget"
            id="attention-widget"
            hidden
          >
            <span class="caption">Needs attention</span
            ><strong id="attention">0</strong>
          </div>
        </section>
        <section class="account-panel">
          <div class="toolbar">
            <div class="toolbar-actions">
              <label
                >Check balances
                <select id="interval" aria-label="Auto-refresh interval">
                  <option value="15">Every 15 minutes</option>
                  <option value="30">Every 30 minutes</option>
                  <option value="60" selected>Every hour</option>
                  <option value="180">Every 3 hours</option>
                  <option value="0">Off</option>
                </select></label
              ><button id="refresh-all" class="quiet">
                <span aria-hidden="true">↻</span> Refresh all
              </button>
            </div>
          </div>
          <div id="accounts" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <dialog id="add-dialog" aria-labelledby="add-title">
      <div class="modal-heading">
        <h2 id="add-title">Add account</h2>
        <button class="close" data-close aria-label="Close">×</button>
      </div>
      <div id="provider-list"></div>
    </dialog>
    <dialog id="connect-dialog">
      <form id="connect-form">
        <div class="modal-heading">
          <div>
            <h2 id="connect-title">Connect</h2>
          </div>
          <button type="button" class="close" data-close aria-label="Close">
            ×
          </button>
        </div>
        <input type="hidden" name="provider" />
        <div id="method-tabs" class="method-tabs"></div>
        <div id="fields"></div>
        <label class="field"
          >Alert threshold <span class="optional">optional</span
          ><input
            name="threshold"
            type="number"
            min="0"
            step="any"
            placeholder="e.g. 10"
          /><small>Flag balances below this amount.</small></label
        >
        <p id="form-error" class="error" role="alert"></p>
        <div class="modal-actions">
          <button type="button" id="disconnect" class="danger">
            Disconnect</button
          ><button type="submit" class="primary" id="save-connection">
            Connect account
          </button>
        </div>
      </form>
    </dialog>
    <dialog id="browser-dialog" aria-labelledby="browser-title">
      <div class="modal-heading">
        <h2 id="browser-title">Connect browser</h2>
        <button class="close" id="browser-close" aria-label="Close">×</button>
      </div>
      <p>
        Sign in and open your billing page. Find your balance, then confirm it
        in the browser.
      </p>
      <p id="browser-status" role="status"></p>
      <div class="browser-actions">
        <button class="quiet" id="browser-open">Open browser</button>
        <button class="primary" id="browser-find">Find balance</button>
        <button class="quiet" id="browser-select">Select manually</button>
        <button class="quiet" id="browser-done">Done</button>
      </div>
      <details id="ai-setup" hidden>
        <summary>Optional AI help</summary>
        <p id="ai-destination"></p>
        <button class="quiet" id="browser-assist">
          Suggest a balance with AI
        </button>
      </details>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
