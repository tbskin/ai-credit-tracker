<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Credit Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Credit Tracker</h1>
    <p id="status">Connecting to your local dashboard…</p>
    <form id="pair-form" hidden>
      <label>Pairing code<input id="code" required autocomplete="off" /></label
      ><button>Pair with dashboard</button>
    </form>
    <section id="connected" hidden>
      <label>Account<select id="provider"></select></label
      ><button id="pick">Select balance on this page</button>
      <p>
        Open your billing page first. Select only the full number, such as
        $1,234.56.
      </p>
    </section>
    <p id="error" role="alert"></p>
    <a href="http://localhost:4747" target="_blank">Open dashboard ↗</a>
    <script type="module" src="popup.js"></script>
  </body>
</html>
